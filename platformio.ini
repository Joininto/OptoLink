[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = 192.168.178.190
#upload_port = /dev/ttyUSB0
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = default.csv

lib_deps =
    knolleary/PubSubClient@^2.8
    plerup/EspSoftwareSerial@^8.2.0
